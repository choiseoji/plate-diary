<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>오늘의 한 접시</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#E8A34D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="한 접시">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#EAF1EA;
    --plate:#FFFDF6;
    --ink:#2B3A34;
    --ink-soft:#5C6F66;
    --accent:#E8A34D;
    --accent-dark:#C97F2E;
    --coral:#C65D4B;
    --sage:#8FA89C;
    --line:#D9E3DB;
    --shadow: 0 10px 30px rgba(43,58,52,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    font-family:'Noto Sans KR', sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .phone{
    width:100%;
    max-width:400px;
    height:100vh;
    background: var(--plate);
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .notch{ display:none; }
  .screen{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:24px 22px 24px;
    min-height:0;
    position:relative;
    overflow:hidden;
  }
  #authScreen{ overflow-y:auto; }
  .hidden{display:none !important;}

  /* ---------- Auth ---------- */
  .brandmark{
    width:64px;height:64px;margin:0 auto 10px;
    display:flex;align-items:center;justify-content:center;
  }
  .brand-title{
    font-family:'Gowun Batang', serif;
    font-size:24px;
    text-align:center;
    margin:0 0 4px;
    letter-spacing:0.02em;
  }
  .brand-sub{
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    margin:0 0 28px;
  }
  .tabs{
    display:flex;
    background:var(--bg);
    border-radius:14px;
    padding:4px;
    margin-bottom:22px;
  }
  .tab-btn{
    flex:1;
    border:none;
    background:transparent;
    padding:10px 0;
    font-family:'Noto Sans KR';
    font-weight:700;
    font-size:14px;
    color:var(--ink-soft);
    border-radius:11px;
    cursor:pointer;
    transition:all .2s ease;
  }
  .tab-btn.active{
    background:var(--plate);
    color:var(--ink);
    box-shadow:0 2px 8px rgba(43,58,52,0.10);
  }
  .field{
    margin-bottom:14px;
  }
  .field label{
    display:block;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:6px;
    font-weight:500;
  }
  .field input{
    width:100%;
    padding:13px 14px;
    border:1.5px solid var(--line);
    border-radius:12px;
    font-size:15px;
    font-family:'Noto Sans KR';
    background:#fff;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease;
  }
  .field input:focus{ border-color:var(--accent); }
  .primary-btn{
    width:100%;
    padding:14px 0;
    background:var(--coral);
    color:#fff;
    border:none;
    border-radius:14px;
    font-size:15px;
    font-weight:700;
    font-family:'Noto Sans KR';
    cursor:pointer;
    margin-top:8px;
    transition:transform .12s ease, background .15s ease;
  }
  .primary-btn:hover{ background:#B14E3E; }
  .primary-btn:active{ transform:scale(0.98); }
  .primary-btn:disabled{ background:#cbb9b3; cursor:not-allowed; }
  .error-text{
    color:var(--coral);
    font-size:12.5px;
    margin-top:10px;
    text-align:center;
    min-height:16px;
  }

  /* ---------- Main ---------- */
  .header-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .header-title{
    font-family:'Gowun Batang', serif;
    font-size:20px;
  }
  .header-title span{ color:var(--accent-dark); }
  .icon-btn{
    background:var(--bg);
    border:none;
    width:34px;height:34px;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .month-nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    margin-bottom:14px;
  }
  .month-nav button{
    background:none;border:none;cursor:pointer;
    color:var(--sage);
    font-size:18px;
    padding:4px 8px;
  }
  .month-label{
    font-family:'Space Mono', monospace;
    font-size:15px;
    font-weight:700;
    letter-spacing:0.02em;
    min-width:120px;
    text-align:center;
  }
  .weekday-row{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    margin-bottom:6px;
  }
  .weekday-row div{
    text-align:center;
    font-family:'Space Mono', monospace;
    font-size:11px;
    color:var(--sage);
    font-weight:700;
  }
  .calendar-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:7px;
    margin-bottom:18px;
  }
  .day-cell{
    aspect-ratio:1/1;
    border-radius:12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    cursor:default;
  }
  .day-cell.empty-slot{ visibility:hidden; }
  .day-num{
    font-family:'Space Mono', monospace;
    font-size:10px;
    color:var(--ink-soft);
    position:absolute;
    top:3px;
    left:6px;
  }
  .plate-wrap{
    width:86%;
    aspect-ratio:1/1;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:transparent;
  }
  .plate-wrap.filled{
    cursor:pointer;
    animation:pop .25s ease;
  }
  .plate-wrap img{
    width:100%;height:100%;object-fit:cover;
  }
  .day-cell.today .day-num{ color:var(--coral); font-weight:700; }

  @keyframes pop{
    0%{ transform:scale(0.6); opacity:0; }
    100%{ transform:scale(1); opacity:1; }
  }


  /* ---------- Modal ---------- */
  .modal-overlay{
    position:absolute;
    inset:0;
    background:rgba(43,58,52,0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:20;
    padding:30px;
  }
  .modal-card{
    background:var(--plate);
    border-radius:24px;
    padding:26px 22px 22px;
    width:100%;
    text-align:center;
    animation:modalIn .2s ease;
    box-shadow:var(--shadow);
  }
  @keyframes modalIn{
    0%{ transform:scale(0.9); opacity:0; }
    100%{ transform:scale(1); opacity:1; }
  }
  .modal-date{
    font-family:'Space Mono', monospace;
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:14px;
  }
  .modal-plate{
    width:180px;height:180px;
    border-radius:50%;
    overflow:hidden;
    margin:0 auto 18px;
    border:3px solid #fff;
    box-shadow:0 0 0 2px var(--line), 0 8px 20px rgba(43,58,52,0.18);
  }
  .modal-plate img{ width:100%;height:100%;object-fit:cover; }
  .modal-comments-section{
    max-height:140px;
    overflow-y:auto;
    margin-bottom:14px;
    text-align:left;
  }
  .modal-comments-title{
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .modal-actions{
    display:flex;
    gap:8px;
  }
  .ghost-btn{
    flex:1;
    padding:11px 0;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:transparent;
    color:var(--ink-soft);
    font-family:'Noto Sans KR';
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
  }
  .ghost-btn.danger{
    border-color:#ecd2cc;
    color:var(--coral);
  }

  .toast{
    position:absolute;
    bottom:80px;
    left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:#fff;
    padding:10px 18px;
    border-radius:999px;
    font-size:12.5px;
    z-index:30;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, bottom .25s ease;
    white-space:nowrap;
  }
  .toast.show{ opacity:1; bottom:90px; }


  /* ---------- Bottom Nav ---------- */
  .bottom-nav{
    display:flex;
    align-items:flex-end;
    background:var(--plate);
    border-top:1px solid var(--line);
    padding:8px 0 16px;
    flex-shrink:0;
  }
  .nav-btn{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    background:none;
    border:none;
    cursor:pointer;
    color:var(--sage);
    font-family:'Noto Sans KR';
    font-size:11px;
    font-weight:500;
    padding:6px 0;
    transition:color .15s;
  }
  .nav-btn.active{ color:var(--accent-dark); }
  .nav-center-btn{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    background:none;
    border:none;
    cursor:pointer;
    font-family:'Noto Sans KR';
    font-size:11px;
    font-weight:500;
    padding:0;
    margin-bottom:2px;
  }
  .nav-center-circle{
    width:52px;height:52px;
    border-radius:50%;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    color:#fff;
    box-shadow:0 4px 14px rgba(232,163,77,0.55);
    transition:transform .15s ease, background .15s ease;
    margin-top:-20px;
    animation:pulse 2.4s ease-in-out infinite;
  }
  .nav-center-btn:active .nav-center-circle{ transform:scale(0.93); }
  .nav-center-btn.done .nav-center-circle{
    background:#E4EAE6;
    box-shadow:none;
    animation:none;
  }
  .nav-center-btn.done{ color:var(--sage); cursor:default; }
  .nav-center-label{ color:var(--accent-dark);font-weight:700; }
  .nav-center-btn.done .nav-center-label{ color:var(--sage);font-weight:500; }
  @keyframes pulse{
    0%,100%{ box-shadow:0 4px 14px rgba(232,163,77,0.55); }
    50%{ box-shadow:0 4px 20px rgba(232,163,77,0.8); }
  }

  /* ---------- Feed ---------- */
  .feed-date-label{
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:16px;
    text-align:center;
  }
  #feedList{
    flex:1;
    overflow-y:auto;
    min-height:0;
  }
  .feed-empty{
    text-align:center;
    color:var(--sage);
    font-size:13px;
    padding:40px 0;
  }
  .feed-card{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 0;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .feed-thumb{
    width:56px;height:56px;
    border-radius:50%;
    overflow:hidden;
    flex-shrink:0;
    background:var(--bg);
    display:flex;align-items:center;justify-content:center;
  }
  .feed-thumb img{ width:100%;height:100%;object-fit:cover; }
  .feed-info{ flex:1;min-width:0; }
  .feed-username{ font-weight:700;font-size:14px;margin-bottom:3px; }
  .feed-preview{ font-size:12px;color:var(--ink-soft); }
  .feed-arrow{ color:var(--sage);font-size:20px;font-weight:300; }

  /* ---------- Comments (내 캘린더) ---------- */
  .comments-section{
    margin-top:12px;
    padding-top:16px;
    border-top:1px solid var(--line);
    flex:1;
    overflow-y:auto;
    min-height:0;
  }
  .comments-title{
    font-size:13px;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .comment-item{
    margin-bottom:8px;
    padding:10px 12px;
    background:var(--bg);
    border-radius:10px;
  }
  .comment-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:3px;
  }
  .comment-from{ font-weight:700;font-size:12.5px;color:var(--accent-dark); }
  .comment-time{ font-size:11px;color:var(--sage); }
  .comment-text{ font-size:13px;color:var(--ink); }
  .no-comments{ font-size:12.5px;color:var(--sage);text-align:center;padding:10px 0; }

  /* ---------- Feed Detail ---------- */
  .feed-detail{
    position:absolute;
    inset:0;
    background:var(--plate);
    z-index:25;
    display:flex;
    flex-direction:column;
    animation:slideIn .2s ease;
  }
  @keyframes slideIn{
    0%{ transform:translateX(100%); }
    100%{ transform:translateX(0); }
  }
  .feed-detail-header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:16px 22px 12px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .back-btn{
    background:none;border:none;cursor:pointer;
    color:var(--ink-soft);
    font-size:24px;
    padding:0;
    display:flex;align-items:center;
    line-height:1;
  }
  .feed-detail-user{ font-weight:700;font-size:16px; }
  .feed-detail-body{
    flex:1;
    overflow-y:auto;
    padding:20px 22px;
  }
  .feed-detail-photo{
    width:200px;height:200px;
    border-radius:50%;
    overflow:hidden;
    margin:0 auto 20px;
    background:var(--bg);
  }
  .feed-detail-photo img{ width:100%;height:100%;object-fit:cover; }
  .feed-detail-comments-title{
    font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:10px;
  }
  .feed-no-comments{
    text-align:center;color:var(--sage);font-size:13px;padding:20px 0;
  }
  .comment-input-row{
    display:flex;
    gap:8px;
    padding:12px 22px;
    border-top:1px solid var(--line);
    background:var(--plate);
    flex-shrink:0;
  }
  .comment-input{
    flex:1;
    padding:10px 14px;
    border:1.5px solid var(--line);
    border-radius:999px;
    font-size:14px;
    font-family:'Noto Sans KR';
    background:#fff;
    color:var(--ink);
    outline:none;
  }
  .comment-input:focus{ border-color:var(--accent); }
  .comment-send-btn{
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:999px;
    padding:10px 18px;
    font-family:'Noto Sans KR';
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    flex-shrink:0;
  }
  .comment-send-btn:disabled{ background:#ccc;cursor:not-allowed; }
</style>
</head>
<body>

<div class="phone">
  <div class="notch"></div>

  <!-- AUTH SCREEN -->
  <div class="screen" id="authScreen">
    <div class="brandmark">
      <svg width="52" height="52" viewBox="0 0 52 52" fill="none">
        <circle cx="26" cy="26" r="24" fill="#FFFDF6" stroke="#D9E3DB" stroke-width="2"/>
        <circle cx="26" cy="26" r="16" fill="none" stroke="#E8A34D" stroke-width="1.5" stroke-dasharray="2 4"/>
        <circle cx="26" cy="26" r="6" fill="#C65D4B"/>
      </svg>
    </div>
    <h1 class="brand-title">오늘의 한 접시</h1>
    <p class="brand-sub">매일 한 장, 오늘의 식탁을 담아요</p>

    <div class="tabs">
      <button class="tab-btn active" id="tabLogin">로그인</button>
      <button class="tab-btn" id="tabSignup">회원가입</button>
    </div>

    <div id="loginForm">
      <div class="field">
        <label>아이디</label>
        <input type="text" id="loginId" autocomplete="username" placeholder="아이디를 입력해요">
      </div>
      <div class="field">
        <label>비밀번호</label>
        <input type="password" id="loginPw" autocomplete="current-password" placeholder="비밀번호를 입력해요">
      </div>
      <button class="primary-btn" id="loginBtn">로그인</button>
    </div>

    <div id="signupForm" class="hidden">
      <div class="field">
        <label>아이디</label>
        <input type="text" id="signupId" placeholder="사용할 아이디">
      </div>
      <div class="field">
        <label>비밀번호</label>
        <input type="password" id="signupPw" placeholder="비밀번호 (4자 이상)">
      </div>
      <div class="field">
        <label>비밀번호 확인</label>
        <input type="password" id="signupPw2" placeholder="비밀번호 다시 입력">
      </div>
      <button class="primary-btn" id="signupBtn">시작하기</button>
    </div>

    <p class="error-text" id="authError"></p>
  </div>

  <!-- MAIN SCREEN (내 캘린더) -->
  <div class="screen hidden" id="mainScreen">
    <div class="header-row">
      <div class="header-title">오늘의 <span>한 접시</span></div>
      <button class="icon-btn" id="logoutBtn" title="로그아웃">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>

    <div class="month-nav">
      <button id="prevMonth">◀</button>
      <div class="month-label" id="monthLabel">2026 · 07</div>
      <button id="nextMonth">▶</button>
    </div>

    <div class="weekday-row">
      <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>

    <!-- 받은 댓글 -->
    <div class="comments-section hidden" id="commentsSection">
      <div class="comments-title">받은 댓글</div>
      <div id="myCommentsList"></div>
    </div>

  </div>

  <!-- FEED SCREEN -->
  <div class="screen hidden" id="feedScreen">
    <div class="header-row">
      <div class="header-title">오늘의 <span>피드</span></div>
    </div>
    <div class="feed-date-label" id="feedDateLabel"></div>
    <div id="feedList"></div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav hidden" id="bottomNav">
    <button class="nav-btn active" id="navCalendar">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      내 캘린더
    </button>
    <button class="nav-center-btn" id="fabBtn">
      <div class="nav-center-circle">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </div>
      <span class="nav-center-label" id="fabLabel">접시 담기</span>
    </button>
    <button class="nav-btn" id="navFeed">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      피드
    </button>
  </nav>

  <input type="file" accept="image/*" capture="environment" id="fileInput" class="hidden">
  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
  const $ = (id) => document.getElementById(id);

  const SUPABASE_URL = 'https://nuhasltrqjebjearbzwv.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable__YRx767qMySMVndZFmMIbg_n11uQjgU';

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  window._sb = sb;
  const BUCKET = 'plate-photos';
  const PSEUDO_DOMAIN = 'platediary.local';

  function usernameToEmail(username){

  }

  function escHtml(str){
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function formatTime(isoStr){
    const d = new Date(isoStr);
    const diff = (Date.now() - d) / 1000;
    if(diff < 60) return '방금';
    if(diff < 3600) return `${Math.floor(diff/60)}분 전`;
    if(diff < 86400) return `${Math.floor(diff/3600)}시간 전`;
    return `${d.getMonth()+1}/${d.getDate()}`;
  }

  let currentUser = null;
  let viewYear, viewMonth;
  let monthCache = {};

  const today = new Date();
  const todayY = today.getFullYear(), todayM = today.getMonth(), todayD = today.getDate();
  const todayStr = `${todayY}-${String(todayM+1).padStart(2,'0')}-${String(todayD).padStart(2,'0')}`;

  function ymKey(y,m){ return `${y}-${String(m+1).padStart(2,'0')}`; }
  function dayKey(d){ return String(d).padStart(2,'0'); }
  function firstOfMonth(y,m){ return `${y}-${String(m+1).padStart(2,'0')}-01`; }
  function firstOfNextMonth(y,m){ const nm=m+1; return nm>11 ? `${y+1}-01-01` : `${y}-${String(nm+1).padStart(2,'0')}-01`; }

  let _toastTimer = null;
  function showToast(msg){
    if(_toastTimer) clearTimeout(_toastTimer);
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    _toastTimer = setTimeout(()=>{ t.classList.remove('show'); _toastTimer=null; }, 1800);
  }
  function showPersistentToast(msg){
    if(_toastTimer) clearTimeout(_toastTimer);
    _toastTimer = null;
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
  }
  function hideToast(){
    if(_toastTimer) clearTimeout(_toastTimer);
    _toastTimer = null;
    $('toast').classList.remove('show');
  }

  // ---------- Month data ----------
  async function fetchMonthEntries(y,m){
    const from = firstOfMonth(y,m);
    const to = firstOfNextMonth(y,m);
    try{
      const { data, error } = await sb
        .from('entries')
        .select('entry_date, photo_path')
        .eq('user_id', currentUser.id)
        .gte('entry_date', from)
        .lt('entry_date', to);
      if(error){ console.error(error); return {}; }
      const map = {};
      data.forEach(row => {
        const d = row.entry_date.split('-')[2];
        const { data: urlData } = sb.storage.from(BUCKET).getPublicUrl(row.photo_path);
        map[d] = { url: urlData.publicUrl, path: row.photo_path };
      });
      return map;
    }catch(e){
      console.error(e);
      return {};
    }
  }

  async function loadMonth(y,m){
    $('monthLabel').textContent = `${y} · ${String(m+1).padStart(2,'0')}`;
    const cacheKey = `${currentUser.id}:${ymKey(y,m)}`;
    let entries = monthCache[cacheKey];
    if(!entries){
      entries = await fetchMonthEntries(y,m);
      monthCache[cacheKey] = entries;
    }
    renderCalendar(y,m,entries);
    updateFab(y,m,entries);
    // 오늘 달 볼 때만 댓글 섹션 표시
    if(y === todayY && m === todayM){
      $('commentsSection').classList.remove('hidden');
      loadTodayComments();
    } else {
      $('commentsSection').classList.add('hidden');
    }
  }

  $('prevMonth').addEventListener('click', ()=>{
    viewMonth--; if(viewMonth<0){ viewMonth=11; viewYear--; }
    loadMonth(viewYear, viewMonth);
  });
  $('nextMonth').addEventListener('click', ()=>{
    viewMonth++; if(viewMonth>11){ viewMonth=0; viewYear++; }
    loadMonth(viewYear, viewMonth);
  });

  function renderCalendar(y,m,entries){
    const grid = $('calendarGrid');
    grid.innerHTML = '';
    const firstDow = new Date(y,m,1).getDay();
    const daysInMonth = new Date(y,m+1,0).getDate();

    for(let i=0;i<firstDow;i++){
      const empty = document.createElement('div');
      empty.className = 'day-cell empty-slot';
      grid.appendChild(empty);
    }
    for(let d=1; d<=daysInMonth; d++){
      const cell = document.createElement('div');
      const isToday = (y===todayY && m===todayM && d===todayD);
      cell.className = 'day-cell' + (isToday ? ' today' : '');

      const num = document.createElement('div');
      num.className = 'day-num';
      num.textContent = d;
      cell.appendChild(num);

      const plate = document.createElement('div');
      const dk = dayKey(d);
      if(entries[dk]){
        plate.className = 'plate-wrap filled';
        const img = document.createElement('img');
        img.src = entries[dk].url;
        plate.appendChild(img);
        plate.addEventListener('click', ()=> openModal(y,m,d, entries[dk].url, entries[dk].path, isToday));
      } else {
        plate.className = 'plate-wrap';
        cell.addEventListener('click', ()=>{
          if(isToday){
            $('fileInput').click();
          } else {
            showToast('오늘의 접시만 채울 수 있어요 🍽️');
          }
        });
      }
      cell.appendChild(plate);
      grid.appendChild(cell);
    }
  }

  function updateFab(y,m,entries){
    const isCurrentMonthView = (y===todayY && m===todayM);
    const fab = $('fabBtn');
    const label = $('fabLabel');
    if(!isCurrentMonthView){
      fab.classList.add('done');
      fab.disabled = true;
      label.textContent = '완료';
      return;
    }
    const dk = dayKey(todayD);
    if(entries[dk]){
      fab.classList.add('done');
      fab.disabled = true;
      label.textContent = '완료';
    } else {
      fab.classList.remove('done');
      fab.disabled = false;
      label.textContent = '접시 담기';
    }
  }

  $('fabBtn').addEventListener('click', ()=>{
    if($('fabBtn').disabled) return;
    $('fileInput').click();
  });

  // ---------- Image capture ----------
  $('fileInput').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    e.target.value = '';
    if(!file) return;

    const fab = $('fabBtn');
    const fabLabel = $('fabLabel');
    fab.disabled = true;
    fab.classList.add('done');
    fabLabel.textContent = '사진 저장 중...';

    try{
      const { data: authData, error: authErr } = await sb.auth.getUser();
      if(authErr || !authData.user){
        showToast('로그인이 풀린 것 같아요. 다시 로그인해주세요.');
        return;
      }
      const realUserId = authData.user.id;

      const blob = await cropToCircleBlob(file);
      const path = `${realUserId}/${ymKey(todayY,todayM)}/${dayKey(todayD)}_${Date.now()}.jpg`;

      showPersistentToast('저장하는 중...');
      const { error: upErr } = await sb.storage.from(BUCKET).upload(path, blob, {
        contentType: 'image/jpeg',
        upsert: true
      });
      if(upErr){ throw upErr; }

      const entryDate = `${todayY}-${String(todayM+1).padStart(2,'0')}-${dayKey(todayD)}`;
      const { error: dbErr } = await sb.from('entries').upsert({
        user_id: realUserId,
        entry_date: entryDate,
        photo_path: path
      }, { onConflict: 'user_id,entry_date' });
      if(dbErr){ throw dbErr; }

      const { data: urlData } = sb.storage.from(BUCKET).getPublicUrl(path);
      const cacheKey = `${currentUser.id}:${ymKey(todayY,todayM)}`;
      let entries = monthCache[cacheKey] || {};
      entries[dayKey(todayD)] = { url: urlData.publicUrl, path };
      monthCache[cacheKey] = entries;

      if(viewYear===todayY && viewMonth===todayM){
        renderCalendar(todayY,todayM,entries);
        updateFab(todayY,todayM,entries);
      }
      hideToast();
      showToast('오늘의 접시를 담았어요 🍚');
    }catch(err){
      console.error(err);
      hideToast();
      showToast('사진을 담지 못했어요. 다시 시도해주세요.');
      fab.classList.remove('done');
      fab.disabled = false;
      fabLabel.textContent = '오늘의 접시 담기';
    }
  });

  function cropToCircleBlob(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = (ev)=>{
        const img = new Image();
        img.onload = ()=>{
          const size = 480;
          const canvas = document.createElement('canvas');
          canvas.width = size; canvas.height = size;
          const ctx = canvas.getContext('2d');
          const srcSize = Math.min(img.width, img.height);
          const sx = (img.width - srcSize) / 2;
          const sy = (img.height - srcSize) / 2;
          ctx.drawImage(img, sx, sy, srcSize, srcSize, 0, 0, size, size);
          canvas.toBlob((blob)=> resolve(blob), 'image/jpeg', 0.8);
        };
        img.onerror = reject;
        img.src = ev.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // ---------- Modal (내 사진) ----------
  function openModal(y,m,d,photoUrl,photoPath,isToday){
    const entryDate = `${y}-${String(m+1).padStart(2,'0')}-${dayKey(d)}`;
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-card">
        <div class="modal-date">${y}. ${String(m+1).padStart(2,'0')}. ${String(d).padStart(2,'0')}</div>
        <div class="modal-plate"><img src="${photoUrl}"></div>
        <div class="modal-comments-section">
          <div class="modal-comments-title">받은 댓글</div>
          <div id="modalCommentsList"><p class="no-comments">불러오는 중...</p></div>
        </div>
        <div class="modal-actions">
          <button class="ghost-btn" id="modalCloseBtn">닫기</button>
          ${isToday ? '<button class="ghost-btn danger" id="modalDeleteBtn">다시 찍기</button>' : ''}
        </div>
      </div>
    `;
    $('mainScreen').appendChild(overlay);
    overlay.querySelector('#modalCloseBtn').addEventListener('click', ()=> overlay.remove());
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });

    // 해당 날짜 댓글 로드
    sb.from('comments')
      .select('*')
      .eq('to_user_id', currentUser.id)
      .eq('entry_date', entryDate)
      .order('created_at', { ascending: true })
      .then(({ data }) => {
        const el = overlay.querySelector('#modalCommentsList');
        if(!data || data.length === 0){
          el.innerHTML = '<p class="no-comments">받은 댓글이 없어요</p>';
          return;
        }
        el.innerHTML = data.map(c => `
          <div class="comment-item">
            <div class="comment-header">
              <span class="comment-from">${escHtml(c.from_username)}</span>
              <span class="comment-time">${formatTime(c.created_at)}</span>
            </div>
            <div class="comment-text">${escHtml(c.content)}</div>
          </div>
        `).join('');
      });

    const delBtn = overlay.querySelector('#modalDeleteBtn');
    if(delBtn){
      delBtn.addEventListener('click', async ()=>{
        try{
          await sb.storage.from(BUCKET).remove([photoPath]);
          await sb.from('entries').delete().eq('user_id', currentUser.id).eq('entry_date', entryDate);

          const cacheKey = `${currentUser.id}:${ymKey(y,m)}`;
          let entries = monthCache[cacheKey] || {};
          delete entries[dayKey(d)];
          monthCache[cacheKey] = entries;

          overlay.remove();
          renderCalendar(y,m,entries);
          updateFab(y,m,entries);
          showToast('오늘의 접시를 비웠어요');
        }catch(e){
          console.error(e);
          showToast('삭제하지 못했어요. 다시 시도해주세요.');
        }
      });
    }
  }

  // ---------- 피드 ----------
  async function loadFeed(){
    $('feedDateLabel').textContent = `${todayY}년 ${todayM+1}월 ${todayD}일`;
    $('feedList').innerHTML = '<p class="feed-empty">불러오는 중...</p>';

    try{
      const { data: entries, error } = await sb
        .from('entries')
        .select('user_id, photo_path')
        .eq('entry_date', todayStr)
        .neq('user_id', currentUser.id);

      if(error) throw error;
      if(!entries || entries.length === 0){
        $('feedList').innerHTML = '<p class="feed-empty">오늘 접시를 올린 친구가 없어요 🍽️</p>';
        return;
      }

      const userIds = entries.map(e => e.user_id);

      const [profilesRes, commentsRes] = await Promise.all([
        sb.from('profiles').select('user_id, username').in('user_id', userIds),
        sb.from('comments').select('to_user_id').in('to_user_id', userIds).eq('entry_date', todayStr)
      ]);

      const profileMap = {};
      (profilesRes.data || []).forEach(p => profileMap[p.user_id] = p.username);

      const countMap = {};
      (commentsRes.data || []).forEach(c => {
        countMap[c.to_user_id] = (countMap[c.to_user_id] || 0) + 1;
      });

      renderFeed(entries, profileMap, countMap);
    }catch(e){
      console.error(e);
      $('feedList').innerHTML = '<p class="feed-empty">불러오지 못했어요. 다시 시도해주세요.</p>';
    }
  }

  function renderFeed(entries, profileMap, countMap){
    const list = $('feedList');
    list.innerHTML = '';

    entries.forEach(entry => {
      const username = profileMap[entry.user_id] || '알 수 없음';
      const { data: urlData } = sb.storage.from(BUCKET).getPublicUrl(entry.photo_path);
      const photoUrl = urlData.publicUrl;
      const count = countMap[entry.user_id] || 0;

      const card = document.createElement('div');
      card.className = 'feed-card';
      card.innerHTML = `
        <div class="feed-thumb">
          <img src="${photoUrl}" alt="${escHtml(username)}의 접시">
        </div>
        <div class="feed-info">
          <div class="feed-username">${escHtml(username)}</div>
          <div class="feed-preview">${count > 0 ? `댓글 ${count}개` : '첫 댓글을 남겨보세요'}</div>
        </div>
        <span class="feed-arrow">›</span>
      `;
      card.addEventListener('click', ()=> openFeedDetail(entry.user_id, username, photoUrl));
      list.appendChild(card);
    });
  }

  function openFeedDetail(toUserId, username, photoUrl){
    const detail = document.createElement('div');
    detail.className = 'feed-detail';
    detail.innerHTML = `
      <div class="feed-detail-header">
        <button class="back-btn" id="feedDetailBack">‹</button>
        <div class="feed-detail-user">${escHtml(username)}의 오늘 접시</div>
      </div>
      <div class="feed-detail-body" id="feedDetailBody">
        <div class="feed-detail-photo">
          <img src="${photoUrl}" alt="접시">
        </div>
        <div class="feed-detail-comments-title">댓글</div>
        <div id="feedDetailComments">
          <p class="feed-no-comments">불러오는 중...</p>
        </div>
      </div>
      <div class="comment-input-row">
        <input class="comment-input" id="feedCommentInput" placeholder="따뜻한 댓글을 남겨보세요" maxlength="100">
        <button class="comment-send-btn" id="feedCommentSend">전송</button>
      </div>
    `;

    $('feedScreen').appendChild(detail);

    detail.querySelector('#feedDetailBack').addEventListener('click', ()=>{
      detail.remove();
      loadFeed();
    });

    async function loadDetailComments(){
      const { data } = await sb
        .from('comments')
        .select('*')
        .eq('to_user_id', toUserId)
        .eq('entry_date', todayStr)
        .order('created_at', { ascending: true });

      const commentsEl = detail.querySelector('#feedDetailComments');
      if(!data || data.length === 0){
        commentsEl.innerHTML = '<p class="feed-no-comments">아직 댓글이 없어요. 첫 댓글을 남겨보세요!</p>';
        return;
      }
      commentsEl.innerHTML = data.map(c => `
        <div class="comment-item">
          <div class="comment-header">
            <span class="comment-from">${escHtml(c.from_username)}</span>
            <span class="comment-time">${formatTime(c.created_at)}</span>
          </div>
          <div class="comment-text">${escHtml(c.content)}</div>
        </div>
      `).join('');
      const body = detail.querySelector('#feedDetailBody');
      body.scrollTop = body.scrollHeight;
    }

    loadDetailComments();

    const sendBtn = detail.querySelector('#feedCommentSend');
    const input = detail.querySelector('#feedCommentInput');

    sendBtn.addEventListener('click', async ()=>{
      const content = input.value.trim();
      if(!content) return;
      sendBtn.disabled = true;
      try{
        const { error } = await sb.from('comments').insert({
          from_user_id: currentUser.id,
          from_username: currentUser.username,
          to_user_id: toUserId,
          entry_date: todayStr,
          content
        });
        if(error) throw error;
        input.value = '';
        await loadDetailComments();
      }catch(e){
        console.error(e);
        showToast('댓글을 보내지 못했어요');
      }
      sendBtn.disabled = false;
    });

    input.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter') sendBtn.click();
    });
  }

})();
</script>
<script>
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('/sw.js');
  }
</script>
